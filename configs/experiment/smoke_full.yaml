# 100-case end-to-end smoke. Confirms the train → val/test post-eval
# (with isotonic fit on test) → external (vitaldb, mover) → PDF report
# pipeline wires up without errors. NOT a real experiment; metrics will
# be noisy with this cohort size.

experiment:
  name: "ioh-prediction-smoke"
  run_name: "smoke_full"

data:
  sources: ["mover_epic"]
  pos_min_pre_onset_min: 5
  neg_min_pre_onset_min: 30
  window_min: 120
  max_seq_len: 2048
  val_frac: 0.15
  test_frac: 0.15
  limit_cases: 100
  seed: 1004

model:
  d_model: 64
  num_layers: 2
  num_heads: 4
  dim_feedforward: null
  dropout: 0.1
  num_classes: 2

train:
  batch_size: 16
  epochs: 2
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  warmup_frac: 0.1
  loss_type: "cross_entropy"
  cosine_ce_weight: 0.1
  class_weights: null
  use_amp: true
  amp_dtype: "bfloat16"
  num_workers: 2
  patience: 5
  monitor: "val_auroc"
  monitor_mode: "max"

paths:
  out_dir: "outputs/runs/smoke_full"
  ckpt_subdir: "ckpts"
  predictions_subdir: "predictions"
  manifest_path: "outputs/runs/smoke_full/manifest.csv"
  normalizer_path: "outputs/runs/smoke_full/normalizer.parquet"
